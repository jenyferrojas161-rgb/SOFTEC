<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFTEC - Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="nav.css" rel="stylesheet">
    <link rel="icon" href="logo-softec.png">

    <style>
        body {
            margin: 0;
        }

        .login-card {
            width: 420px;
            max-width: 92vw;
            background: white;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(90deg, #0A192F, #E63946);
            color: white;
            text-align: center;
            padding: 26px 20px;
        }

        .login-header img {
            height: 46px;
            width: 46px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: #fff;
            padding: 3px;
            margin-bottom: 8px;
        }

        .login-header h2 {
            margin: 0;
            font-weight: 800;
        }

        .login-header p {
            margin: 0;
            opacity: .9;
            font-size: .9rem;
        }

        .login-body {
            padding: 28px;
        }

        .login-body label {
            font-weight: 600;
            color: var(--softec-navy);
            font-size: .88rem;
        }

        .login-body input,
        .login-body select {
            margin-bottom: 14px;
            padding: 10px 12px;
            border-radius: 10px;
        }

        .login-body input:focus,
        .login-body select:focus {
            border-color: var(--softec-teal);
            box-shadow: 0 0 0 .2rem rgba(14, 165, 163, .18);
        }

        .btn-login {
            background: var(--softec-navy);
            color: white;
            width: 100%;
            border: none;
            padding: 11px;
            border-radius: 10px;
            font-weight: 700;
            transition: .2s ease;
        }

        .btn-login:hover:not(:disabled) {
            background: var(--softec-red);
        }

        .btn-login:disabled {
            opacity: .7;
        }

        .link-forgot {
            display: block;
            text-align: center;
            margin-top: 4px;
            color: var(--softec-red);
            text-decoration: none;
            font-weight: 600;
            font-size: .88rem;
        }

        .link-forgot:hover {
            text-decoration: underline;
        }

        /* Campo de contraseña con botón para mostrar/ocultar */
        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 42px;
        }

        .toggle-pass {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 6px 8px;
            line-height: 1;
        }
    </style>

</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg softec-navbar">
        <div class="container-fluid px-4">
            <a class="navbar-brand softec-brand" href="index.html">
                <img src="logo-softec.png" alt="SOFTEC">
                <span>SOFTEC</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#softecNav"
                aria-controls="softecNav" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="softecNav">
                <ul class="navbar-nav mx-auto softec-links">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
                    <span class="d-none d-lg-inline text-muted">¿No tienes cuenta?</span>
                    <a href="registro_usuario.html" class="btn softec-btn-filled">Registrarme →</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="softec-center-wrap">
        <div class="login-card">

            <div class="login-header">
                <img src="logo-softec.png" alt="SOFTEC">
                <h2>SOFTEC</h2>
                <p>Ingreso de usuarios registrados</p>
            </div>

            <div class="login-body">

                <label class="form-label" for="correo">Correo electrónico</label>
                <input type="email" class="form-control" id="correo" placeholder="nombre@correo.com"
                    autocomplete="email" onkeydown="if(event.key==='Enter')document.getElementById('password').focus()">

                <label class="form-label">Contraseña</label>
                <div class="password-wrap">
                    <input type="password" class="form-control" id="password" placeholder="Contraseña"
                        autocomplete="current-password" onkeydown="if(event.key==='Enter')login(event)">
                    <button type="button" class="toggle-pass" onclick="togglePassword('password', this)"
                        aria-label="Mostrar contraseña">👁️</button>
                </div>

                <button class="btn btn-login" onclick="login(event)">
                    Ingresar
                </button>

                <a href="recuperar-password.html" class="link-forgot">¿Olvidaste tu contraseña?</a>

            </div>

        </div>
    </div>

    <footer class="softec-footer">
        © 2026 SOFTEC - Todos los derechos reservados
    </footer>

    <script src="softec-env.js"></script>
    <script src="api-config.js"></script>
    <script src="session.js"></script>
    <script src="auth-guard.js"></script>   <!-- solo se usa softecPaginaInicio(); esta página no exige sesión -->
    <script>

        /* Aviso dejado por un 401 (sesión vencida) */
        (function () { const m = sessionStorage.getItem("softec_aviso"); if (m) { sessionStorage.removeItem("softec_aviso"); setTimeout(() => alert(m), 100); } })();

        /* Muestra/oculta el texto de un campo de contraseña */
        function togglePassword(id, boton) {
            const input = document.getElementById(id);
            const mostrando = input.type === "text";
            input.type = mostrando ? "password" : "text";
            boton.textContent = mostrando ? "👁️" : "🙈";
        }

        async function login(ev) {

            const correo = document.getElementById("correo").value.trim();
            const p = document.getElementById("password").value;

            if (!correo || !p) {
                alert("Escribe tu correo electrónico y tu contraseña.");
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) {
                alert("El correo electrónico no tiene un formato válido.");
                return;
            }

            const boton = document.querySelector(".btn-login");
            boton.disabled = true;
            boton.textContent = "Ingresando...";

            try {
                // El servidor valida el correo y la contraseña (hash BCrypt), devuelve el token
                // y el ROL de la persona: ya no hay que elegirlo en la pantalla.
                const data = await softecLogin(correo, p);
                const etiquetaRol = SOFTEC_ROL_ETIQUETA[data.rol];

                const destinoGuardado = sessionStorage.getItem("softec_redirect");
                sessionStorage.removeItem("softec_redirect");
                window.location.href = destinoGuardado || softecPaginaInicio(etiquetaRol);

            } catch (err) {
                alert("No se pudo iniciar sesión.\n\n" + err.message);
            } finally {
                boton.disabled = false;
                boton.textContent = "Ingresar";
            }
        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="softec-config.js" defer></script>
    <script src="chatbot-widget.js" defer></script>
</body>

</html>
