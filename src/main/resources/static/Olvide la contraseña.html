<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - SOFTEC</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .recovery-box {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            border-top: 8px solid #e53935;
            text-align: center;
        }

        h1 {
            color: #0b1f3a;
            margin-bottom: 8px;
        }

        h2 {
            color: #e53935;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            background: #0b1f3a;
        }

        .btn:hover {
            background: #e53935;
        }

        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: #e53935;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="recovery-box">
        <h1>SOFTEC</h1>
        <h2>Recuperar Contraseña</h2>

        <form>
            <input type="email" placeholder="Ingrese su correo" required>
            <input type="password" placeholder="Nueva contraseña" required>
            <input type="password" placeholder="Confirmar contraseña" required>
            <button type="submit" class="btn">Actualizar contraseña</button>
        </form>

        <a href="login.html" class="back-link">← Volver al login</a>
    </div>
</body>

</html>
