# Perfil de produccion para Render. Configurar estas variables en el panel de Render.
server.port=${PORT:${SOFTEC_PORT:8081}}
spring.datasource.url=${SOFTEC_DB_URL}
spring.datasource.username=${SOFTEC_DB_USER}
spring.datasource.password=${SOFTEC_DB_PASSWORD}
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
softec.security.jwt-secret=${SOFTEC_JWT_SECRET}
