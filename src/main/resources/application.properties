spring.application.name=softech
server.port=${PORT:${SOFTEC_PORT:8081}}

# Perfil por defecto: "dev" (solo para trabajar en el computador local, ver application-dev.properties).
# En un servidor real: SPRING_PROFILES_ACTIVE=prod y definir TODAS las variables de entorno de abajo.
spring.profiles.default=dev

# Base de datos (sin contraseña escrita aqui: viene de la variable de entorno)
spring.datasource.url=${SOFTEC_DB_URL:jdbc:postgresql://localhost:5432/softech_db}
spring.datasource.username=${SOFTEC_DB_USER:postgres}
spring.datasource.password=${SOFTEC_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT: secreto de 256 bits o mas, en Base64. Sin valor por defecto: si falta, la aplicacion no arranca.
softec.security.jwt-secret=${SOFTEC_JWT_SECRET}
softec.security.jwt-expiration-minutes=${SOFTEC_JWT_EXPIRATION_MINUTES:480}

# Origenes del frontend permitidos por CORS (separados por coma)
softec.cors.allowed-origins=${SOFTEC_CORS_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}

logging.level.org.springframework.security=INFO
softec.contact.address=${SOFTEC_ADDRESS:Bogotá D.C., Colombia}
softec.contact.phone=${SOFTEC_PHONE:+57 300 000 0000}
softec.contact.whatsapp=${SOFTEC_WHATSAPP:+57 300 000 0000}
softec.contact.hours=${SOFTEC_HOURS:Lunes a viernes, 8:00 a.m. - 6:00 p.m.}
spring.sql.init.mode=${SOFTEC_SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=true
